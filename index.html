<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator — Day 12</title>
  <style>
    /* ---------- Theme variables (easy to restyle!) ---------- */
    :root {
      --bg: #f5f1e8;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #b45309;
    }
    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --ink: #f9fafb;
      --muted: #9ca3af;
      --accent: #fbbf24;
    }

    /* ---------- Layout ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      transition: background 0.3s, color 0.3s;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 620px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      transition: background 0.3s;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: var(--accent); }

    /* ---------- Quote display ---------- */
    #quote {
      font-size: 1.6rem;
      font-style: italic;
      line-height: 1.5;
      min-height: 7rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #author {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    #author::before { content: "— "; }

    /* ---------- Controls ---------- */
    .controls { margin-top: 2rem; display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    select {
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 2px solid var(--accent);
      background: var(--card);
      color: var(--ink);
      font-size: 1rem;
    }
    button {
      padding: 0.65rem 1.2rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.96); }
    .ghost {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
    }
    .hint { margin-top: 1.2rem; font-size: 0.85rem; color: var(--muted); font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Quote Generator</h1>
    <p id="quote">Loading wisdom…</p>
    <p id="author"></p>
    <div class="controls">
      <select id="category" title="Pick a category">
        <option value="all">All categories</option>
        <option value="motivation">Motivation</option>
        <option value="wisdom">Wisdom</option>
        <option value="hustle">Hustle</option>
        <option value="coding">Coding</option>
      </select>
      <button id="new-btn">New Quote</button>
      <button id="copy-btn" class="ghost">Copy</button>
      <button id="theme-btn" class="ghost">🌙</button>
    </div>
    <p class="hint">Press <strong>Space</strong> for a new quote</p>
  </div>

  <script>
    // ---------- Quote database: each quote has text, author, and a category ----------
    const QUOTES = [
      { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb", cat: "motivation" },
      { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson", cat: "motivation" },
      { text: "It always seems impossible until it's done.", author: "Nelson Mandela", cat: "motivation" },
      { text: "Knowing yourself is the beginning of all wisdom.", author: "Aristotle", cat: "wisdom" },
      { text: "The only true wisdom is in knowing you know nothing.", author: "Socrates", cat: "wisdom" },
      { text: "What we think, we become.", author: "Buddha", cat: "wisdom" },
      { text: "Hustle beats talent when talent doesn't hustle.", author: "Ross Simmonds", cat: "hustle" },
      { text: "Dream big. Start small. But most of all, start.", author: "Simon Sinek", cat: "hustle" },
      { text: "Discipline is choosing what you want most over what you want now.", author: "Abraham Lincoln", cat: "hustle" },
      { text: "First, solve the problem. Then, write the code.", author: "John Johnson", cat: "coding" },
      { text: "Code is like humor. When you have to explain it, it's bad.", author: "Cory House", cat: "coding" },
      { text: "The most disastrous thing you can ever learn is your first programming language.", author: "Alan Kay", cat: "coding" }
    ];

    // ---------- Grab the elements we need ----------
    const quoteEl = document.getElementById("quote");
    const authorEl = document.getElementById("author");
    const categoryEl = document.getElementById("category");
    const newBtn = document.getElementById("new-btn");
    const copyBtn = document.getElementById("copy-btn");
    const themeBtn = document.getElementById("theme-btn");

    let lastIndex = -1; // avoid showing the same quote twice in a row

    // ---------- Show a random quote (filtered by category if chosen) ----------
    function showQuote() {
      const cat = categoryEl.value;
      const pool = cat === "all" ? QUOTES : QUOTES.filter(q => q.cat === cat);

      let i;
      do {
        i = Math.floor(Math.random() * pool.length);
      } while (pool.length > 1 && i === lastIndex);
      lastIndex = i;

      quoteEl.textContent = "\u201C" + pool[i].text + "\u201D";
      authorEl.textContent = pool[i].author;
    }

    // ---------- Copy the current quote to the clipboard ----------
    copyBtn.addEventListener("click", async () => {
      const text = `${quoteEl.textContent} ${authorEl.textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = "Copied ✓";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
      } catch {
        copyBtn.textContent = "Copy failed";
      }
    });

    // ---------- Dark / light theme toggle ----------
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      themeBtn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    });

    // ---------- Wire up the buttons ----------
    newBtn.addEventListener("click", showQuote);
    categoryEl.addEventListener("change", showQuote);

    // Press Space anywhere for a new quote
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        showQuote();
      }
    });

    showQuote(); // show one immediately on load
  </script>
</body>
</html>
